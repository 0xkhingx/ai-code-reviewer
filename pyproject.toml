[project]
name = "firstpass"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "psycopg[binary,pool]>=3.1",
  "httpx>=0.27",
  "pyjwt[crypto]>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["apps*", "core*", "db*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
