services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: reviewer
      POSTGRES_PASSWORD: reviewer
      POSTGRES_DB: reviewer
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs only on first init of the volume. Re-run manually after schema changes.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reviewer"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: .
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    environment:
      DATABASE_URL: postgresql://reviewer:reviewer@postgres:5432/reviewer
    volumes:
      - .:/app
      - ./github-app.pem:/run/secrets/github-app.pem:ro
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }

  worker:
    build: .
    command: python -m apps.worker.main
    env_file: .env
    environment:
      DATABASE_URL: postgresql://reviewer:reviewer@postgres:5432/reviewer
    volumes:
      - .:/app
      - ./github-app.pem:/run/secrets/github-app.pem:ro
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
